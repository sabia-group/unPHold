site_name: unPHold
site_url: https://unphold.readthedocs.io/

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Installation: installation.md
  - Theory:
      - Unfolding theory: theory/unfolding.md
      - Metrics for mode characterization: theory/metrics.md
  - Tutorials:
      - "3D bulk: Si": tutorials/si.md
      - "2D layers: twisted bilayer graphene": tutorials/twisted_bilayer.md
      - "Defect material: graphene with vacancy": tutorials/defect.md
      - "Heterostructure: molecular array on graphene": tutorials/mol2dmat.md
      - "Graphene phonon mode characterization": tutorials/metrics.md
  - API Reference:
      - Unfold: api/unfold.md
      - Metrics: api/metrics.md
      - Visualization: api/visualize.md
      - Utilities: api/utils.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
  - footnotes

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
