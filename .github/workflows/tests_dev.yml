name: CI (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  test:
    name: Tests (phonopy ~=${{ matrix.phonopy-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phonopy-version: ["3.0", "4.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and dev deps
        run: pip install -e ".[all]" "phonopy~=${{ matrix.phonopy-version }}"
      - name: Run tests
        run: pytest tests/ -v

  # for branch protection
  ci-ok:
    name: CI OK (dev)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check that lint and all test matrix legs succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && \
          [ "${{ needs.test.result }}" = "success" ]
